<!DOCTYPE html>

  <!-- Redirect old hash-based URLs to clean URLs -->
  <!-- e.g., /Blog-Website/#/about -> /Blog-Website/about -->
  <script>
    (function () {
      var hash = window.location.hash;
      // Check if hash starts with #/ (old HashRouter format)
      if (hash && hash.startsWith('#/')) {
        var path = hash.slice(1); // Remove the # to get /about
        var newUrl = window.location.pathname + path;
        // Replace current URL with clean URL
        window.location.replace(newUrl);
      }
    })();
  </script>

  <!-- Font Optimization with font-display: swap -->
  <style>
    /* Critical CSS for font loading - prevent FOUT */
    html:not(.fonts-loaded) body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Ensure smooth font loading with font-display: swap */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Inter');
    }

    /* Critical above-the-fold styles for CLS prevention */
    #root {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    body {

      padding: 0;

      max-width: 100%;
      height: auto;
    }
  </style>

  <!-- Single Page Apps for GitHub Pages - Handle redirects from 404.html -->
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string,
    // converts it back into the correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which won't cause the browser to attempt to load the new url.
    // When the single page app is loaded further down in this file,
    // the correct url will be waiting in the browser's history for
    // the single page app to route accordingly.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        // Remove trailing slash from pathname to prevent double slashes
        var basePath = l.pathname.replace(/\/$/, '');
        window.history.replaceState(null, null,
          basePath + decoded + l.hash
        );
      }
    }(window.location))
  </script>
