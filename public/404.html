<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script takes the current url and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new url with only a query string and hash fragment,
    // e.g. http://www.foo.tld/one/two?a=b&c=d#qwe, becomes
    // http://www.foo.tld/?/one/two&a=b~and~c=d#qwe
    // Note: this 404.html file must be at least 512 bytes for it to work
    // with Internet Explorer (it is currently > 512 bytes)

    // Configure pathSegmentsToKeep based on your deployment:
    // - GitHub Pages with custom domain (e.g., blog.example.com): Set to 0
    // - GitHub Pages project pages (e.g., username.github.io/repo-name/): Set to 1
    // - GitHub Pages enterprise or nested paths: May need > 1
    // 
    // Current setup is for GitHub Pages project pages (M-F-Tushar/Blog-Website)
    // which deploys to: https://m-f-tushar.github.io/Blog-Website/
    // 
    // Example with pathSegmentsToKeep = 1:
    // https://username.github.io/repo-name/one/two?a=b&c=d#qwe becomes
    // https://username.github.io/repo-name/?/one/two&a=b~and~c=d#qwe
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <noscript>
    <p>JavaScript is required for this site to work properly. Please enable JavaScript and refresh the page.</p>
  </noscript>
</body>
</html>
